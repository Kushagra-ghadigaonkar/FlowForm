kind: Job
apiVersion: batch/v1
metadata:
  name: migrate-db
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: kushagr488/flowform-api:latest
          imagePullPolicy: Always

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DATABASE_URL

          command:
            - pnpm
            - db:migrate
