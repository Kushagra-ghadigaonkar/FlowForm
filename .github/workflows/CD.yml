name: cd

on: 
  workflow_call:

jobs:
  deploy-push:
    runs-on: self-hosted
    steps:
      - name: checkout the code
        uses: actions/checkout@v7

      - name: Docker Setup
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Deploy the container with docker compose
        run: |
          docker compose pull
          docker compose up -d